spring.application.name=tick-kline-aggregator-java

# 主周期（毫秒），同时作为未显式指定周期时的默认查询周期；兼容历史配置键
kline.window-size-ms=60000

# 同时聚合的周期列表（逗号分隔，毫秒）。留空或删除即退化为仅 window-size-ms 单周期。
# 每个周期必须是最小周期的整数倍，保证大周期由整数个连续小周期拼成、跨周期严格对齐。
kline.window-sizes-ms=60000,300000

# 时间合法性范围
kline.max-lateness-ms=86400000
kline.max-future-ms=300000

# 每个标的、每个周期保留的窗口数上限，超出自动回收最旧窗口；
# 幂等去重表不随窗口回收。默认 10000（1 分钟周期约覆盖 7 天）。
kline.max-windows-per-period=10000
