spring.application.name=tick-kline-aggregator-java
# 默认（基础）聚合周期，毫秒；60000 = 1 分钟
kline.window-size-ms=60000
# 额外同时聚合的周期，毫秒；逗号分隔。例：1m/5m/15m 三周期并行
kline.additional-window-sizes-ms=
# 每个标的、每个周期保留的窗口数上限，超出后自动回收最旧窗口（默认 10000）
kline.max-windows-per-symbol=10000
# 单次范围查询最多返回的窗口槽位数（默认 5000）
kline.max-range-windows=5000
kline.max-lateness-ms=86400000
kline.max-future-ms=300000
